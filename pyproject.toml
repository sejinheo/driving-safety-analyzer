[project]
name = "driving-safety-analyzer"
version = "0.1.0"
description = "차량 주행 로그 정제·분석 백엔드"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.2",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "python-multipart==0.0.33",
    "polars==2.1.0",
    "numpy==2.5.4",
    "ijson==3.6.0",
    "sqlalchemy==2.1.8",
    "psycopg[binary,pool]==3.3.8",
    "structlog==26.1.0",
    "geoalchemy2==0.17.1",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-mock==3.17.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "ruff==0.17.4",
    "mypy==2.4.1",
    "import-linter==2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "RUF", "T20", "S110", "DTZ"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "계층 의존 방향"
type = "layers"
layers = ["app.presentation", "app.application", "app.infra", "app.core", "app.domain"]

[[tool.importlinter.contracts]]
name = "domain은 프레임워크를 모른다"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = ["fastapi", "starlette", "sqlalchemy", "psycopg", "pydantic", "pydantic_settings", "ijson", "structlog"]

[[tool.importlinter.contracts]]
name = "presentation과 core 밖에서는 FastAPI를 모른다"
type = "forbidden"
source_modules = ["app.application", "app.infra", "app.domain"]
forbidden_modules = ["fastapi", "starlette"]
